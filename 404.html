<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página no encontrada · Booking Lab</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@700;800&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f2f1ec;color:#0f1512;font:16px/1.6 Inter,system-ui,sans-serif;text-align:center;padding:24px;box-sizing:border-box}
h1{font:800 clamp(4rem,14vw,8rem)/1 "Inter Tight",sans-serif;color:#ff5a1f;margin:0}
h2{font:700 1.8rem/1.2 "Inter Tight",sans-serif;margin:12px 0}
p{color:#646d68;margin:0 0 26px}
a{display:inline-block;background:#ff5a1f;color:#fff;text-decoration:none;font-weight:600;padding:14px 22px;border-radius:10px}
</style>
</head>
<body>
<div>
  <h1>404</h1>
  <h2>Esta página no existe</h2>
  <p>Puede que el enlace esté mal o que la página se haya movido.</p>
  <a id="home" href="/">Volver al inicio →</a>
</div>
<script>
// En GitHub Pages sin dominio propio la web vive en /nombre-del-repositorio/
if(location.hostname.endsWith('github.io')){
  const repo=location.pathname.split('/')[1];
  if(repo) document.getElementById('home').href='/'+repo+'/';
}
</script>
</body>
</html>
